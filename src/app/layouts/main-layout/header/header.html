<!-- Top -->
<section class="hidden bg-[#62A403] text-white md:block">
  <div
    class="mx-auto flex w-full items-center justify-between
           px-8 py-2
           md:px-8 md:gap-4
           lg:px-12 lg:gap-8 lg:text-base
           xl:px-16 xl:gap-12 xl:text-lg
           2xl:h-11 2xl:px-20 2xl:gap-20 2xl:text-lg"
  >
    <!-- Left Side -->
    <div class="flex items-center">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-money-bill-wave"></i>
        <span>Cash on Delivery Available</span>
      </div>

      <span class="mx-4 text-white/60 lg:mx-6 xl:mx-8 2xl:mx-10">|</span>

      <div class="flex items-center gap-2">
        <i class="fa-brands fa-whatsapp"></i>
        <span>+8801765890646</span>
      </div>

      <span class="mx-4 text-white/60 lg:mx-6 xl:mx-8 2xl:mx-10">|</span>

      <div class="flex items-center gap-2">
        <i class="fa-solid fa-phone"></i>
        <span>09613-821489</span>
      </div>
    </div>

    <!-- Right Side -->
    <div class="flex items-center">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-truck-fast"></i>
        <span>Fast Delivery</span>
      </div>

      <span class="mx-4 text-white/60 lg:mx-6 xl:mx-8 2xl:mx-10">|</span>

      <div class="flex items-center gap-2">
        <i class="fa-solid fa-location-dot"></i>
        <span>Track Order</span>
      </div>
    </div>
  </div>
</section>

<header class="w-full bg-white px-4 md:px-6 lg:px-10 xl:px-16 2xl:px-20 pb-3 md:pb-4">
  <!-- Top row: Logo + Mobile menu + Cart (mobile) / Full nav (desktop) -->
  <div class="flex items-center justify-between h-16 md:h-18 lg:h-20 gap-3 md:gap-4 lg:gap-6 xl:gap-10 2xl:gap-15">

    <!-- Left: Hamburger (mobile only) + Logo -->
    <div class="flex items-center gap-3 md:gap-4">
      <!-- Mobile menu button -->
      <button class="lg:hidden flex h-10 w-10 items-center justify-center rounded-lg hover:bg-gray-100 transition">
        <i class="fa-solid fa-bars text-xl text-gray-700"></i>
      </button>

      <!-- Logo -->
      <a href="#" class="flex-shrink-0">
        <img
          src="8 [Converted] 1.png"
          alt="Leaf Gradient"
          class="h-12 md:h-14 lg:h-16 xl:h-[72px] 2xl:h-[80px] w-auto object-contain"
        />
      </a>
    </div>

    <!-- Center Nav (hidden on mobile, visible from lg) -->
    <nav class="hidden lg:flex items-center">
      <ul class="flex items-center gap-8 xl:gap-12 2xl:gap-20">
        <li>
          <a href="#" class="text-base xl:text-[18px] 2xl:text-[20px] font-medium text-[#62A403] hover:text-[#4f8702] transition-colors">
            Home
          </a>
        </li>
        <li class="relative">
          <button
            type="button"
            class="flex items-center gap-1.5 xl:gap-2 text-base xl:text-[18px] 2xl:text-[20px] font-medium text-gray-700 hover:text-[#62A403] transition-colors"
            (click)="toggleCategoryMenu()"
            aria-haspopup="menu"
            [attr.aria-expanded]="categoryMenuOpen()"
          >
            Categories
            <i class="fa-solid fa-chevron-down text-[10px] xl:text-xs"></i>
          </button>

          <div
            *ngIf="categoryMenuOpen()"
            class="category-dropdown"
            role="menu"
          >
            <button
              type="button"
              *ngFor="let category of categories"
              class="category-dropdown__item"
              role="menuitem"
              (click)="goToCategory(category.id)"
            >
              {{ category.label }}
            </button>
          </div>
        </li>
      </ul>
    </nav>

    <!-- Offers Button (hidden on mobile & tablet, visible from lg) -->
    <button
      class="hidden lg:flex h-9 xl:h-10 2xl:h-[42px] w-[100px] xl:w-[110px] 2xl:w-[120px] items-center justify-center gap-1.5 xl:gap-2 rounded-lg bg-[#62A403] px-3 xl:px-4 text-sm xl:text-base font-semibold text-white shadow-[0_8px_16px_0_rgba(145,158,171,0.16)] transition-all duration-300 hover:bg-[#4F8702]">
      <span class="flex h-5 w-5 xl:h-6 xl:w-6 items-center justify-center rounded-full border border-white">
        <i class="fa-solid fa-tags text-[10px] xl:text-xs"></i>
      </span>
      <span>Offers</span>
    </button>

    <!-- Search Bar (hidden on mobile, visible from md) -->
    <form
      class="search-form hidden md:flex flex-1 max-w-[320px] lg:max-w-[420px] xl:max-w-[520px] 2xl:max-w-[574px] h-10 xl:h-11 2xl:h-[45px] rounded-md border border-[#E5E7EB] bg-[#F4F6F8]"
      (submit)="$event.preventDefault(); searchProducts()"
    >
      <!-- Category -->
      <button
        class="flex w-12 xl:w-14 2xl:w-[56px] items-center justify-center border-r border-[#E5E7EB] bg-[#F4F6F8] text-sm xl:text-[15px] font-medium text-[#637381] shrink-0">
        All
      </button>

      <!-- Input -->
      <input
        type="text"
        placeholder="What are you shopping for?"
        [value]="searchTerm"
        (input)="onSearchInput($event)"
        class="flex-1 min-w-0 px-3 xl:px-4 text-sm xl:text-[15px] text-[#637381] placeholder:text-[#637381] outline-none bg-transparent"
      />

      <!-- Search Button -->
      <button
        type="submit"
        class="m-1 flex h-8 w-8 xl:h-9 xl:w-9 2xl:h-[36px] 2xl:w-[36px] items-center justify-center rounded-full bg-[#F3F4F6] hover:bg-[#E5E7EB] transition shrink-0">
        <i class="fa-solid fa-magnifying-glass text-sm xl:text-[15px] 2xl:text-[16px] text-[#9CA3AF]"></i>
      </button>

      <div *ngIf="searchSuggestions.length" class="search-suggestions">
        <button
          type="button"
          *ngFor="let suggestion of searchSuggestions"
          class="search-suggestions__item"
          (click)="selectSuggestion(suggestion)"
        >
          {{ suggestion }}
        </button>
      </div>
    </form>

    <!-- Right icons -->
    <div class="flex items-center gap-2 md:gap-3 lg:gap-4 xl:gap-5">
      <!-- User (hidden on pure mobile, visible from md) -->
      <button class="hidden md:flex h-9 w-9 lg:h-10 lg:w-10 xl:h-11 xl:w-11 items-center justify-center rounded-full bg-[#F7F8FA] hover:bg-gray-100 transition">
        <i class="fa-regular fa-user text-base lg:text-lg"></i>
      </button>

      <!-- Wishlist -->
      <button class="hidden md:flex h-9 w-9 lg:h-10 lg:w-10 xl:h-11 xl:w-11 items-center justify-center rounded-full bg-[#F7F8FA] hover:bg-gray-100 transition">
        <i class="fa-regular fa-heart text-base lg:text-lg"></i>
      </button>

      <!-- Cart (always visible) -->
      <button class="relative flex h-9 w-9 md:h-10 md:w-10 lg:h-11 lg:w-11 items-center justify-center rounded-lg border-2 border-[#62A403]">
        <i class="fa-solid fa-bag-shopping text-[#62A403] text-base md:text-lg"></i>
        <span class="absolute -right-1.5 -top-1.5 md:-right-2 md:-top-2 flex h-4 w-4 md:h-5 md:w-5 items-center justify-center rounded-full bg-black text-[9px] md:text-[10px] text-white font-medium">
          2
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Search Bar (only on mobile) -->
  <form
    class="search-form md:hidden mt-3 flex h-11 rounded-md border border-[#E5E7EB] bg-[#F4F6F8]"
    (submit)="$event.preventDefault(); searchProducts()"
  >
    <button class="flex w-14 items-center justify-center border-r border-[#E5E7EB] text-[14px] font-medium text-[#637381] shrink-0">
      All
    </button>
    <input
      type="text"
      placeholder="What are you shopping for?"
      [value]="searchTerm"
      (input)="onSearchInput($event)"
      class="flex-1 min-w-0 px-3 text-[14px] text-[#637381] placeholder:text-[#637381] outline-none bg-transparent"
    />
    <button type="submit" class="m-1.5 flex h-8 w-8 items-center justify-center rounded-full bg-[#F3F4F6]">
      <i class="fa-solid fa-magnifying-glass text-[15px] text-[#9CA3AF]"></i>
    </button>

    <div *ngIf="searchSuggestions.length" class="search-suggestions">
      <button
        type="button"
        *ngFor="let suggestion of searchSuggestions"
        class="search-suggestions__item"
        (click)="selectSuggestion(suggestion)"
      >
        {{ suggestion }}
      </button>
    </div>
  </form>
</header>
