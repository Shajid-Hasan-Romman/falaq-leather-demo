<section class="w-full bg-surface px-4 pb-3 md:pb-4 lg:px-6">
  <div class="mx-auto w-full max-w-[1392px]">
    <!-- Desktop Stepper -->
    <div class="hidden md:block">
      <app-checkout-stepper></app-checkout-stepper>
    </div>

    <!-- Checkout Layout -->
    <div
      class="mt-4 flex flex-col gap-4 md:mt-8 lg:grid lg:grid-cols-[minmax(0,1fr)_minmax(0,460px)] lg:items-start lg:gap-6"
    >
      <!-- Left Column -->
      <div class="flex min-w-0 flex-col gap-4 lg:gap-6">
        <!-- 1. Mobile Stepper -->
        <div class="order-1 md:hidden">
          <app-checkout-stepper></app-checkout-stepper>
        </div>

        <!-- 2. Delivery Area (Desktop: Top / Mobile: Bottom) -->
        <app-checkout-delivery-area
          class="order-3 md:order-1"
          (areaChange)="updateDeliveryArea($event)"
        ></app-checkout-delivery-area>

        <!-- 3. Billing Form (Desktop: Bottom / Mobile: Middle) -->
        <app-checkout-billing-form
          class="order-2 md:order-2"
          [invalidFieldIds]="invalidBillingFieldIds()"
          (valuesChange)="updateBillingValues($event)"
        ></app-checkout-billing-form>
      </div>

      <!-- Right Column (Order Summary) -->
      <div class="flex min-w-0 flex-col">
        <app-checkout-order-summary
          [summary]="summary()"
          (placeOrder)="placeOrder()"
        ></app-checkout-order-summary>
      </div>
    </div>

  </div>
</section>
