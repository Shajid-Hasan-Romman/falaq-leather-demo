<section class="lg:overflow-hidden lg:rounded-2xl lg:bg-surface lg:shadow-card lg:border lg:border-gray-100 lg:p-6">
  <header class="flex h-12 gap-2.5">
    <!-- Reusable shared SVG icon (24×24) -->
    <app-ic-delivery aria-hidden="true" class="shrink-0"></app-ic-delivery>
    <h2 class="text-lg font-bold leading-7 text-ink">Select your delivery area</h2>
  </header>
  <!-- Mobile: 3 equal grid columns (no extra space), Desktop: Flex -->
  <div class="grid grid-cols-3 gap-2.5 sm:flex sm:flex-wrap md:gap-5" role="radiogroup" aria-label="Delivery area">
    @for (tile of tiles(); track tile.area.id) {
    <button type="button" class="relative flex flex-col items-center justify-center rounded-xl p-2 outline-none w-full"
      [class]="tile.tileClass" role="radio" [attr.aria-checked]="tile.selected" (click)="selectArea(tile.area)">
      <span class="text-[10px] font-semibold leading-[18px] text-ink text-center truncate w-full">
        {{ tile.area.name }}
      </span>
      <span [class]="'text-xs sm:text-sm font-semibold leading-[22px] ' + tile.priceClass">
        {{ tile.area.price }}
      </span>

      @if (tile.selected) {
      <span
        class="absolute -right-1 -top-1 flex h-4 w-4 sm:h-5 sm:w-5 items-center justify-center rounded-full bg-brand text-white"
        aria-hidden="true">
        <i class="fa-solid fa-check text-[8px] sm:text-[10px]"></i>
      </span>
      }
    </button>
    }
  </div>
</section>
