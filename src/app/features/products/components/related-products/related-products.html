<section class="mt-16">

    <!-- Heading -->
    <div class="flex items-center justify-between mb-8">

        <h2 class="text-4xl font-bold text-[#1F2937]">
            Related Product's
        </h2>

        <div class="flex gap-3">

            <button
                class="w-11 h-11 rounded-full border border-gray-200 flex items-center justify-center hover:bg-green-50">

                <i class="fa-solid fa-chevron-left text-[#65A30D]"></i>

            </button>

            <button
                class="w-11 h-11 rounded-full border border-gray-200 flex items-center justify-center hover:bg-green-50">

                <i class="fa-solid fa-chevron-right text-[#65A30D]"></i>

            </button>

        </div>

    </div>

    <!-- Cards -->

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

        <div
            *ngFor="let product of products"
            class="bg-white rounded-2xl border border-[#E5E7EB] overflow-hidden hover:shadow-lg transition">

            <!-- Image -->

            <div class="relative p-6">

                <img
                    [src]="product.image"
                    [alt]="product.name"
                    class="w-full h-52 object-contain">

                <span
                    class="absolute top-4 right-4 bg-[#FF5722] text-white text-xs font-semibold px-3 py-1 rounded-full">

                    -{{product.discount}}%

                </span>

            </div>

            <!-- Content -->

            <div class="px-5 pb-5">

                <h3
                    class="text-[17px] font-semibold text-[#1F2937] line-clamp-2 min-h-[52px]">

                    {{product.name}}

                </h3>

                <div class="flex items-center gap-2 mt-3">

                    <span class="text-2xl font-bold text-[#65A30D]">

                        ৳{{product.price | number}}

                    </span>

                    <span class="text-sm text-gray-400 line-through">

                        ৳{{product.oldPrice | number}}

                    </span>

                </div>

                <button
                    class="w-full mt-5 h-12 rounded-full bg-[#65A30D] text-white font-semibold flex items-center justify-center gap-2 hover:bg-[#4F8A08] transition">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Add to Cart

                </button>

            </div>

        </div>

    </div>

</section>
