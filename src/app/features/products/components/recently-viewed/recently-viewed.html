<section class="py-12">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">

        <h2 class="text-[42px] font-bold text-[#273142]">
            Recently Viewed
        </h2>

        <div class="flex gap-3">

            <button
                class="w-11 h-11 rounded-full border border-[#E5E7EB] hover:bg-green-50 transition">

                <i class="fa-solid fa-chevron-left text-[#65A30D]"></i>

            </button>

            <button
                class="w-11 h-11 rounded-full border border-[#E5E7EB] hover:bg-green-50 transition">

                <i class="fa-solid fa-chevron-right text-[#65A30D]"></i>

            </button>

        </div>

    </div>

    <!-- Cards -->

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

        <div
            *ngFor="let product of products"
            class="bg-white rounded-3xl border border-[#E5E7EB] overflow-hidden hover:shadow-xl transition duration-300">

            <!-- Image -->

            <div class="relative p-6">

                <img
                    [src]="product.image"
                    [alt]="product.title"
                    class="w-full h-56 object-contain">

                <span
                    class="absolute top-4 right-4 bg-[#FF5A1F] text-white text-xs font-semibold rounded-full px-3 py-1">

                    -{{product.discount}}%

                </span>

            </div>

            <!-- Content -->

            <div class="px-5 pb-5">

                <h3
                    class="text-[17px] font-semibold text-[#273142] line-clamp-2 min-h-[52px]">

                    {{product.title}}

                </h3>

                <div class="flex items-center gap-2 mt-3">

                    <span class="text-2xl font-bold text-[#65A30D]">
                        ৳{{product.price | number}}
                    </span>

                    <span class="text-sm line-through text-gray-400">
                        ৳{{product.oldPrice | number}}
                    </span>

                </div>

                <button
                    class="w-full mt-5 h-12 rounded-full bg-[#65A30D] text-white font-semibold flex items-center justify-center gap-2 hover:bg-[#4E8E09] transition">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Add to Cart

                </button>

            </div>

        </div>

    </div>

</section>
