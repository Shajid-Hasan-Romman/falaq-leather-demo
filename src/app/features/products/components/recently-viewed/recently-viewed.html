<section class="py-8 lg:py-12">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6 lg:mb-8">

        <h2 class="text-xl sm:text-2xl md:text-3xl lg:text-[42px] font-bold text-[#273142]">
            Recently Viewed
        </h2>

        <div class="flex items-center gap-2 sm:gap-3">

            <button
                class="w-9 h-9 sm:w-10 sm:h-10 lg:w-11 lg:h-11 rounded-full border border-[#E5E7EB] flex items-center justify-center hover:bg-green-50 transition">
                <i class="fa-solid fa-chevron-left text-[#62A403]"></i>
            </button>

            <button
                class="w-9 h-9 sm:w-10 sm:h-10 lg:w-11 lg:h-11 rounded-full border border-[#E5E7EB] flex items-center justify-center hover:bg-green-50 transition">
                <i class="fa-solid fa-chevron-right text-[#62A403]"></i>
            </button>

        </div>

    </div>

    <!-- Product Grid -->
    <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 lg:gap-6">

        <div
            *ngFor="let product of products"
            class="w-full bg-white border border-[#E5E7EB] rounded-2xl overflow-hidden hover:shadow-xl transition duration-300 flex flex-col">

            <!-- Image -->
            <div class="relative aspect-square flex items-center justify-center p-4">

                <img
                    [src]="product.image"
                    [alt]="product.name"
                    class="w-full h-full object-contain">

                <!-- Discount -->
                <span
                    class="absolute top-3 right-3 bg-[#FF5A1F] text-white text-xs sm:text-sm font-bold rounded-full px-3 py-1">
                    -{{product.discount}}%
                </span>

            </div>

            <!-- Content -->
            <div class="flex flex-col flex-1 p-4">

                <h3
                    class="text-sm sm:text-base lg:text-lg font-semibold text-[#273142] line-clamp-2 min-h-[48px]">
                                        {{product.name}}
                </h3>

                <!-- Price -->
                <div class="flex items-center gap-2 mt-3 flex-wrap">

                    <span class="text-lg sm:text-xl lg:text-2xl font-bold text-[#62A403]">
                        ৳{{product.price | number}}
                    </span>

                    <span class="text-sm text-[#9CA3AF] line-through">
                        ৳{{product.oldPrice | number}}
                    </span>

                </div>

                <!-- Button -->
                                <button
                    (click)="addToCart(product)"
                    class="mt-5 w-full py-3 rounded-full bg-[#62A403] text-white text-sm lg:text-base font-semibold flex items-center justify-center gap-2 hover:bg-[#548d03] transition">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Add to Cart

                </button>

            </div>

        </div>

    </div>

</section>
