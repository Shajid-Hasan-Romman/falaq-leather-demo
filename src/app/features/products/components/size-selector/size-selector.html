<div class="flex flex-col lg:flex-row justify-between gap-10">

  <!-- Left -->
  <div>

    <h3 class="text-lg font-semibold mb-4">
      Select Size
    </h3>

    <div class="flex gap-4">

      <button
        *ngFor="let size of sizes"
        (click)="selectSize(size)"
        class="relative w-20 h-20 rounded-xl border transition-all duration-200 flex flex-col justify-center items-center"
        [ngClass]="{
          'border-green-500 bg-green-50': selectedSize === size,
          'border-gray-200 bg-white hover:border-green-300': selectedSize !== size
        }">

        <div
          *ngIf="selectedSize === size"
          class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-green-600 flex items-center justify-center">

          <i class="fa-solid fa-check text-white text-[10px]"></i>

        </div>

        <span
          class="font-bold"
          [ngClass]="{
            'text-green-600': selectedSize === size,
            'text-gray-900': selectedSize !== size
          }">
          {{ size.name }}
        </span>

        <span
          class="text-sm mt-1"
          [ngClass]="{
            'text-green-600': selectedSize === size,
            'text-gray-500': selectedSize !== size
          }">
          ৳{{ size.price | number }}
        </span>

      </button>

    </div>

    <!-- Price -->

    <div class="mt-8">

      <h4 class="font-semibold mb-3">
        Subtotal Price
      </h4>

      <div class="flex items-center gap-3">

        <span class="text-4xl font-bold text-green-600">
          ৳{{ selectedSize.price | number }}
        </span>

        <span class="border border-blue-500 text-blue-600 rounded-md px-2 py-1 text-xs font-medium">
          Save ৳200
        </span>

      </div>

    </div>

  </div>

  <!-- Quantity -->

  <div>

    <h3 class="text-lg font-semibold mb-4">
      Quantity
    </h3>

    <div class="flex items-center border rounded-xl px-3 py-2 gap-5">

      <button
        (click)="decrease()"
        class="w-10 h-10 border rounded-lg hover:bg-gray-100">

        <i class="fa-solid fa-minus"></i>

      </button>

      <span class="text-xl font-semibold text-green-600">
        {{ quantity }}
      </span>

      <button
        (click)="increase()"
        class="w-10 h-10 border rounded-lg hover:bg-gray-100">

        <i class="fa-solid fa-plus"></i>

      </button>

    </div>

  </div>

</div>
