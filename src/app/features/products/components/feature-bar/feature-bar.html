<!-- Features -->
<div class="w-full py-4 sm:py-5 lg:py-6">

    <div class="grid grid-cols-3 gap-2 sm:gap-4 lg:gap-8">

        <div
            *ngFor="let feature of features"
            class="flex items-center gap-2 sm:gap-3 lg:gap-4 min-w-0">

            <!-- Icon -->
            <div
                class="w-8 h-8 sm:w-10 sm:h-10 lg:w-16 lg:h-16
                       rounded-lg lg:rounded-2xl
                       bg-[#EEF9E8]
                       flex items-center justify-center
                       shrink-0">

                <i
                    [class]="feature.icon"
                    class="text-[#62A403]
                           text-sm sm:text-lg lg:text-2xl">
                </i>

            </div>

            <!-- Text -->
            <div class="min-w-0 flex-1">

                <h3
                    class="font-bold
                           text-[#273142]
                           text-[10px] sm:text-[13px] lg:text-[20px]
                           leading-tight break-words">

                    {{ feature.title }}

                </h3>

                <p
                    class="mt-1
                           text-[#637381]
                           text-[8px] sm:text-[10px] lg:text-[14px]
                           leading-tight break-words">

                    {{ feature.description }}

                </p>

            </div>

        </div>

    </div>

</div>
