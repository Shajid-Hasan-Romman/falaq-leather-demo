<section class="shop-collection page-shell py-12 lg:py-16" aria-labelledby="shop-collection-heading">
  <h2
    id="shop-collection-heading"
    class="font-display text-center text-[1.75rem] leading-tight text-[#1a1a1a] md:text-[2.15rem] lg:text-[2.35rem]"
  >
    Shop To Our Collection
  </h2>

  <div
    class="mt-6 flex items-center justify-center gap-8 md:mt-8 md:gap-12"
    role="tablist"
    aria-label="Collection categories"
  >
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        role="tab"
        class="collection-tab relative pb-2 text-lg text-[#6b6b6b] transition-colors md:text-xl"
        [class.is-active]="activeTab() === tab.id"
        [attr.aria-selected]="activeTab() === tab.id"
        (click)="selectTab(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <div
    class="mt-8 grid grid-cols-1 gap-8 sm:grid-cols-3 sm:gap-5 md:mt-10 md:gap-8 lg:gap-10"
    role="tabpanel"
  >
    @for (item of activeItems(); track item.id) {
      <a [routerLink]="item.path" class="group flex flex-col items-center text-center">
        <div class="aspect-square w-full overflow-hidden bg-[#f5f5f5]">
          <img
            [src]="item.src"
            [alt]="item.alt"
            class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.03]"
            loading="lazy"
            decoding="async"
          />
        </div>
        <h3
          class="mt-4 text-base font-semibold tracking-wide text-[#1a1a1a] uppercase md:mt-5 md:text-lg"
        >
          {{ item.title }}
        </h3>
        <p class="mt-1 text-sm text-[#555] md:text-[0.95rem]">
          {{ item.subtitle }}
        </p>
      </a>
    }
  </div>
</section>
