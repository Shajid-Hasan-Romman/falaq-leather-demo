<section class="w-full relative overflow-hidden bg-white py-12 md:py-16 lg:py-16 xl:py-20 px-4 md:px-8 lg:px-10 xl:px-20">

  <!-- Left Decoration -->
  <img
    src="image 12.png"
    class="absolute left-0 bottom-0 w-12 md:w-16 lg:w-16 xl:w-20 hidden sm:block"
    alt=""
  />

  <div class="mx-auto max-w-[1440px]">

    <!-- ===== MOBILE (NOT TOUCHED) ===== -->
    <div class="md:hidden flex items-start justify-between mb-8">
      <div>
        <div class="flex items-center gap-2">
          <div class="flex gap-1">
            <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
            <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
            <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
          </div>
          <span class="text-[10px] font-semibold uppercase tracking-[2px] text-[#62A403]">
            FRESH FROM OUR FARM
          </span>
          <div class="flex gap-1">
            <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
            <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
            <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
          </div>
        </div>

        <h2 class="mt-2 text-[18px] font-bold text-[#1E293B]">
          Featured Categories
        </h2>
      </div>

      <div class="flex items-center gap-2 mt-1">
        <button 
          onclick="document.getElementById('categorySlider').scrollBy({left: -176, behavior: 'smooth'})"
          class="flex h-7 w-7 items-center justify-center rounded-full bg-[#62A403] text-white shadow-sm hover:bg-[#4F8702] transition"
        >
          <i class="fa-solid fa-arrow-left text-[11px]"></i>
        </button>

        <button 
          onclick="document.getElementById('categorySlider').scrollBy({left: 176, behavior: 'smooth'})"
          class="flex h-7 w-7 items-center justify-center rounded-full bg-[#62A403] text-white shadow-sm hover:bg-[#4F8702] transition"
        >
          <i class="fa-solid fa-arrow-right text-[11px]"></i>
        </button>
      </div>
    </div>

    <!-- ===== TABLET + LAPTOP + DESKTOP HEADING ===== -->
    <div class="hidden md:block">
      <div class="flex items-center justify-center gap-2">
        <div class="flex gap-1">
          <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
          <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
          <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
        </div>

        <span class="text-[11px] font-semibold uppercase tracking-[2px] text-[#62A403]">
          FRESH FROM OUR FARM
        </span>

        <div class="flex gap-1">
          <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
          <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
          <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
        </div>
      </div>

      <h2 class="mt-3 md:mt-4 mb-8 md:mb-10 lg:mb-10 xl:mb-16 text-center 
                 text-3xl md:text-4xl lg:text-[34px] xl:text-5xl font-bold text-[#1E293B]">
        Featured Categories
      </h2>
    </div>

    <!-- Categories -->
    <div class="relative">

      <!-- ===== MOBILE ONLY (NOT TOUCHED) ===== -->
      <div class="md:hidden relative">
        <div id="categorySlider" class="overflow-x-auto scrollbar-hide snap-x snap-mandatory scroll-smooth">
          <div class="flex gap-4 px-1" style="width: max-content;">
            @for(category of categories; track category.name){
              <div class="w-[160px] flex-shrink-0 snap-center text-center">
                <img 
                  [src]="category.image" 
                  [alt]="category.name" 
                  class="mx-auto h-[100px] object-contain"
                >
                <h3 class="mt-3 text-base font-semibold text-[#2B3445]">
                  {{category.name}}
                </h3>
                <p class="mt-1 text-xs text-[#8A94A6]">
                  {{category.items}} Items
                </p>
              </div>
            }
          </div>
        </div>

        <div class="flex justify-center gap-1.5 mt-5">
          <span class="h-1.5 w-1.5 rounded-full bg-[#62A403]"></span>
          <span class="h-1.5 w-1.5 rounded-full bg-[#D1D5DB]"></span>
          <span class="h-1.5 w-1.5 rounded-full bg-[#D1D5DB]"></span>
          <span class="h-1.5 w-1.5 rounded-full bg-[#D1D5DB]"></span>
        </div>
      </div>

      <!-- ===== TABLET + LAPTOP + DESKTOP ===== -->
      <div class="hidden md:flex flex-nowrap justify-center items-start
                  gap-4 md:gap-6 lg:gap-3 xl:gap-14
                  px-4 lg:px-6 xl:px-0">
        @for(category of categories; track category.name){
          <div class="w-[120px] md:w-[140px] lg:w-[115px] xl:w-[170px] text-center">
            <img 
              [src]="category.image" 
              [alt]="category.name" 
              class="mx-auto h-[75px] md:h-[100px] lg:h-[78px] xl:h-auto object-contain"
            >
            <h3 class="mt-2 md:mt-3 lg:mt-2 xl:mt-5 text-[13px] md:text-base lg:text-[13px] xl:text-lg font-semibold text-[#2B3445]">
              {{category.name}}
            </h3>
            <p class="mt-0.5 text-[11px] md:text-sm text-[#8A94A6]">
              {{category.items}} Items
            </p>
          </div>
        }
      </div>

    </div>

  </div>

</section>
