<section class="shop-collection page-shell py-8 sm:py-10 md:py-12 lg:py-16" aria-labelledby="shop-collection-heading">
  <h2
    id="shop-collection-heading"
    class="font-display px-2 text-center text-[1.5rem] leading-tight text-[#1a1a1a] sm:text-[1.75rem] md:text-[2.15rem] lg:text-[2.35rem]"
  >
    Shop To Our Collection
  </h2>

  <div
    class="collection-tabs mt-5 flex flex-wrap items-center justify-center gap-x-5 gap-y-2 sm:mt-6 sm:gap-x-8 md:mt-8 md:gap-x-12"
    role="tablist"
    aria-label="Collection categories"
  >
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        role="tab"
        class="collection-tab relative shrink-0 pb-2 text-base text-[#6b6b6b] transition-colors sm:text-lg md:text-xl"
        [class.is-active]="activeTab() === tab.id"
        [attr.aria-selected]="activeTab() === tab.id"
        (click)="selectTab(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <div
    class="mt-6 grid grid-cols-1 gap-6 sm:mt-8 sm:grid-cols-2 sm:gap-5 md:mt-10 md:grid-cols-3 md:gap-8 lg:gap-10"
    role="tabpanel"
  >
    @for (item of activeItems(); track item.id) {
      <a [routerLink]="item.path" class="group flex min-w-0 flex-col items-center text-center">
        <div class="aspect-square w-full overflow-hidden bg-[#f5f5f5]">
          <img
            [src]="item.src"
            [alt]="item.alt"
            class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.03]"
            loading="lazy"
            decoding="async"
          />
        </div>
        <h3
          class="mt-3 text-sm font-semibold tracking-wide text-[#1a1a1a] uppercase sm:mt-4 sm:text-base md:mt-5 md:text-lg"
        >
          {{ item.title }}
        </h3>
        <p class="mt-1 max-w-[18rem] text-sm text-[#555] md:text-[0.95rem]">
          {{ item.subtitle }}
        </p>
      </a>
    }
  </div>
</section>
