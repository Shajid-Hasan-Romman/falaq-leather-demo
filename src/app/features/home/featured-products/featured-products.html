<section
  class="featured-products page-shell py-8 sm:py-10 md:py-12 lg:py-16"
  aria-labelledby="featured-products-heading"
>
  <h2
    id="featured-products-heading"
    class="font-display px-2 text-center text-[1.5rem] leading-tight text-[#1a2b48] sm:text-[1.75rem] md:text-[2.15rem] lg:text-[2.35rem]"
  >
    Our Featured Products
  </h2>

  <div class="relative mt-6 sm:mt-8 md:mt-10">
    <button
      type="button"
      class="featured-nav absolute top-1/2 left-0 z-10 hidden -translate-y-1/2 text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:cursor-default disabled:opacity-30 lg:-left-2 lg:block xl:-left-4"
      aria-label="Previous products"
      [disabled]="!canPrev()"
      (click)="prev()"
    >
      «
    </button>

    <button
      type="button"
      class="featured-nav absolute top-1/2 right-0 z-10 hidden -translate-y-1/2 text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:cursor-default disabled:opacity-30 lg:-right-2 lg:block xl:-right-4"
      aria-label="Next products"
      [disabled]="!canNext()"
      (click)="next()"
    >
      »
    </button>

    <div
      class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4 lg:gap-5 xl:gap-6"
      aria-live="polite"
    >
      @for (product of visibleProducts(); track product.id) {
        <article class="product-card flex min-w-0 flex-col border border-[#e8e8e8] bg-white">
          <a [routerLink]="product.path" class="block overflow-hidden bg-white p-3 sm:p-4">
            <div class="aspect-square w-full">
              <img
                [src]="product.image"
                [alt]="product.alt"
                class="h-full w-full object-contain object-center transition-transform duration-500 ease-out hover:scale-[1.03]"
                loading="lazy"
                decoding="async"
              />
            </div>
          </a>

          <div class="flex flex-1 flex-col px-3 pb-4 sm:px-4 sm:pb-5">
            <h3 class="text-center text-sm leading-snug text-[#1a1a1a] sm:text-[0.95rem] md:text-base">
              <a [routerLink]="product.path" class="hover:text-brand">
                {{ product.name }}
              </a>
            </h3>

            <div class="mt-3 flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
              <p class="text-sm font-semibold text-[#1a1a1a] md:text-[0.95rem]">
                {{ product.currency }} {{ product.price | number: '1.2-2' }}
              </p>
              <a
                [routerLink]="product.path"
                class="shrink-0 text-sm font-medium text-[#d64545] transition-colors hover:text-[#b83232] md:text-[0.95rem]"
              >
                Buy Now
              </a>
            </div>
          </div>
        </article>
      }
    </div>

    <!-- Mobile / tablet nav under grid -->
    <div class="mt-6 flex items-center justify-center gap-6 lg:hidden">
      <button
        type="button"
        class="text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:opacity-30"
        aria-label="Previous products"
        [disabled]="!canPrev()"
        (click)="prev()"
      >
        «
      </button>
      <button
        type="button"
        class="text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:opacity-30"
        aria-label="Next products"
        [disabled]="!canNext()"
        (click)="next()"
      >
        »
      </button>
    </div>
  </div>
</section>
