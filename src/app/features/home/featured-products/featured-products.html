<section
  class="featured-products page-shell py-8 sm:py-10 md:py-12 lg:py-16"
  aria-labelledby="featured-products-heading"
>
  <h2
    id="featured-products-heading"
    class="font-display px-2 text-center text-[1.5rem] leading-tight text-[#1a2b48] sm:text-[1.75rem] md:text-[2.15rem] lg:text-[2.35rem]"
  >
    Our Featured Products
  </h2>

  <div class="relative mt-6 sm:mt-8 md:mt-10">
    <button
      type="button"
      class="featured-nav absolute top-1/2 left-0 z-10 hidden -translate-y-1/2 text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:cursor-default disabled:opacity-30 lg:-left-4 lg:block"
      aria-label="Previous products"
      [disabled]="!canPrev()"
      (click)="prev()"
    >
      «
    </button>

    <button
      type="button"
      class="featured-nav absolute top-1/2 right-0 z-10 hidden -translate-y-1/2 text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:cursor-default disabled:opacity-30 lg:-right-4 lg:block"
      aria-label="Next products"
      [disabled]="!canNext()"
      (click)="next()"
    >
      »
    </button>

    <div
      class="product-card-grid grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4 lg:gap-6"
      aria-live="polite"
    >
      @for (product of visibleProducts(); track product.id) {
        <article class="product-card">
          <a [routerLink]="product.path" class="product-card__media">
            <div class="product-card__image aspect-square">
              <img
                [src]="product.image"
                [alt]="product.alt"
                loading="lazy"
                decoding="async"
              />
            </div>
          </a>

          <div class="product-card__body">
            <h3 class="product-card__title">
              <a [routerLink]="product.path">{{ product.name }}</a>
            </h3>

            <app-product-card-actions
              class="product-card__actions"
              [slug]="slugFromPath(product.path)"
              [price]="product.price"
              [currency]="product.currency"
            />
          </div>
        </article>
      }
    </div>

    <!-- Mobile / tablet nav under grid -->
    <div class="mt-6 flex items-center justify-center gap-6 lg:hidden">
      <button
        type="button"
        class="text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:opacity-30"
        aria-label="Previous products"
        [disabled]="!canPrev()"
        (click)="prev()"
      >
        «
      </button>
      <button
        type="button"
        class="text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:opacity-30"
        aria-label="Next products"
        [disabled]="!canNext()"
        (click)="next()"
      >
        »
      </button>
    </div>
  </div>
</section>
