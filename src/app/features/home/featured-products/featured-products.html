<section class="bg-white py-12">
  <div class="mx-auto w-full px-20">

    <!-- Header -->
    <div class="mb-8 flex items-end justify-between">

      <div>
        <p
          class="mb-2 flex items-center gap-2 text-[11px] font-bold uppercase tracking-[1.5px] text-[#69AE14]">

          <span class="flex gap-1">
            <span class="h-[6px] w-[6px] rounded-full bg-[#69AE14]"></span>
            <span class="h-[6px] w-[6px] rounded-full bg-[#69AE14]"></span>
            <span class="h-[6px] w-[6px] rounded-full bg-[#69AE14]"></span>
          </span>

          Fresh From Our Farm

        </p>

        <h2 class="text-[44px] font-extrabold leading-none text-[#1F2937]">
          Featured Products
        </h2>

      </div>

      <button
        class="flex h-[48px] items-center gap-2 rounded-lg border border-[#69AE14] px-7 text-[15px] font-semibold text-[#69AE14] transition hover:bg-[#69AE14] hover:text-white">

        Explore More

        <i class="fa-solid fa-arrow-right text-sm"></i>

      </button>

    </div>

    <!-- Product Grid -->

    <div class="grid grid-cols-4 gap-3">

      @for(product of products; track $index){

      <div
        class="relative flex h-[450px] w-[405px] flex-col rounded-[14px] border border-[#ECECEC] bg-white p-4 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(0,0,0,.08)]">

        <!-- Discount -->

        <span
          class="absolute right-3 top-3 rounded-full bg-[#F15A29] px-2.5 py-1 text-[10px] font-semibold text-white">
        
          {{product.discount}}

        </span>

        <!-- Product Image -->

        <div class="flex h-[200px] items-center justify-center">

          <img
            [src]="product.image"
            [alt]="product.title"
            class="max-h-[250px] w-[250px] object-cover transition duration-300 hover:scale-105">

        </div>

        <!-- Title -->

        <h3 class="mt-15 min-h-[48px] text-[15px] font-medium leading-6 text-[#232323] line-clamp-2">
        
            {{ product.title }}
        
        </h3>

        <!-- Price -->

        <div class="mt-3 flex items-center gap-2">
        
            <span class="flex items-center text-[22px] font-bold text-[#69AE14]">
                <i class="fa-solid fa-bangladeshi-taka-sign mr-1 text-[16px]"></i>
                {{ product.price }}
            </span>
        
            <span class="flex items-center text-[12px] text-[#B6B6B6] line-through">
                <i class="fa-solid fa-bangladeshi-taka-sign mr-1 text-[10px]"></i>
                {{ product.oldPrice }}
            </span>
        
        </div>

        <!-- Button -->
  
        <button
          class="mt-auto flex h-[44px] w-full items-center justify-center gap-2 rounded-md bg-[#69AE14] text-[14px] font-semibold text-white transition duration-300 hover:bg-[#5A9613]">

          <i class="fa-solid fa-cart-shopping text-[13px]"></i>

          Add to Cart

        </button>

      </div>

      }

    </div>

  </div>
</section>
