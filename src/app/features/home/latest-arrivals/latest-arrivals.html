<section
  class="latest-arrivals page-shell py-6 sm:py-8 md:py-12"
  aria-labelledby="latest-arrivals-heading"
>
  <!-- Banner: image | video | title panel -->
  <div class="latest-card overflow-hidden bg-white">
    <div class="latest-row">
      <div class="latest-media latest-media--image relative bg-[#e8d5a8]">
        <img
          [src]="bannerImage"
          alt="Lara Clara — Modern Grace Redefined Glamour"
          class="latest-media-fill"
          loading="lazy"
          decoding="async"
        />
      </div>

      <div class="latest-media latest-video-wrap relative bg-black">
        <video
          #promoVideo
          class="latest-media-fill latest-video"
          [src]="videoSrc"
          autoplay
          loop
          playsinline
          preload="auto"
          muted
          [muted]="true"
          defaultmuted
          disablepictureinpicture
          disableremoteplayback
          aria-hidden="true"
          tabindex="-1"
        ></video>
      </div>

      <div
        class="latest-panel flex flex-col items-center justify-center gap-3 bg-white px-3 text-center sm:gap-4 sm:px-4 lg:gap-5 xl:px-6"
      >
        <h2 id="latest-arrivals-heading" class="font-display latest-title text-[#1a2b48] uppercase">
          Latest<br />Arrivals
        </h2>

        <nav
          class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2"
          aria-label="Shop by category"
        >
          @for (cat of categories; track cat.id) {
            <a
              [routerLink]="cat.path"
              class="latest-pill inline-flex items-center justify-center rounded-full border border-[#cfcfcf] px-2.5 py-1 text-[10px] tracking-wide text-[#1a2b48] uppercase transition-colors hover:border-[#1a2b48] hover:bg-[#1a2b48] hover:text-white sm:px-3 sm:py-1.5 sm:text-[11px]"
            >
              {{ cat.label }}
            </a>
          }
        </nav>
      </div>
    </div>
  </div>

  <!-- Product carousel — same as AmarBay Latest Arrivals strip -->
  <div class="latest-products relative mt-6 sm:mt-8 md:mt-10">
    <button
      type="button"
      class="latest-nav absolute top-1/2 left-0 z-10 hidden -translate-y-1/2 text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:cursor-default disabled:opacity-30 lg:-left-1 lg:block xl:-left-3"
      aria-label="Previous products"
      [disabled]="!canPrev()"
      (click)="prev()"
    >
      «
    </button>

    <button
      type="button"
      class="latest-nav absolute top-1/2 right-0 z-10 hidden -translate-y-1/2 text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:cursor-default disabled:opacity-30 lg:-right-1 lg:block xl:-right-3"
      aria-label="Next products"
      [disabled]="!canNext()"
      (click)="next()"
    >
      »
    </button>

    <div
      class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4 lg:gap-5 xl:gap-6"
      aria-live="polite"
    >
      @for (product of visibleProducts(); track product.id) {
        <article
          class="latest-product-card flex min-w-0 flex-col bg-white shadow-[0_2px_10px_rgba(0,0,0,0.06)] transition-shadow duration-300 hover:shadow-[0_8px_24px_rgba(0,0,0,0.12)]"
        >
          <a [routerLink]="product.path" class="block overflow-hidden bg-white p-3 sm:p-4 md:p-5">
            <div class="aspect-square w-full">
              <img
                [src]="product.image"
                [alt]="product.alt"
                class="h-full w-full object-contain object-center transition-transform duration-500 ease-out hover:scale-[1.03]"
                loading="lazy"
                decoding="async"
              />
            </div>
          </a>

          <div class="flex flex-1 flex-col px-3 pb-4 sm:px-4 sm:pb-5 md:px-5">
            <h3
              class="font-display text-center text-sm leading-snug font-semibold text-[#1a1a1a] sm:text-[0.95rem] md:text-base"
            >
              <a [routerLink]="product.path" class="hover:text-brand">
                {{ product.name }}
              </a>
            </h3>

            <div class="mt-3 flex flex-wrap items-baseline justify-between gap-x-2 gap-y-1">
              <p class="text-sm font-bold text-[#1a1a1a] md:text-[0.95rem]">
                {{ product.currency }} {{ product.price | number: '1.2-2' }}
              </p>
              <a
                [routerLink]="product.path"
                class="font-display shrink-0 text-sm text-[#c0392b] transition-colors hover:text-[#922b21] hover:underline md:text-[0.95rem]"
              >
                Buy Now
              </a>
            </div>
          </div>
        </article>
      }
    </div>

    <div class="mt-6 flex items-center justify-center gap-6 lg:hidden">
      <button
        type="button"
        class="text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:opacity-30"
        aria-label="Previous products"
        [disabled]="!canPrev()"
        (click)="prev()"
      >
        «
      </button>
      <button
        type="button"
        class="text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:opacity-30"
        aria-label="Next products"
        [disabled]="!canNext()"
        (click)="next()"
      >
        »
      </button>
    </div>
  </div>
</section>
