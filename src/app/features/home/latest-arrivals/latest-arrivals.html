<section
  class="latest-arrivals page-shell py-6 sm:py-8 md:py-12"
  aria-labelledby="latest-arrivals-heading"
>
  <!-- Banner: image | video | title panel -->
  <div class="latest-card overflow-hidden bg-white">
    <div class="latest-row">
      <div class="latest-media latest-media--image relative bg-[#e8d5a8]">
        <img
          [src]="bannerImage"
          alt="Lara Clara — Modern Grace Redefined Glamour"
          class="latest-media-fill"
          loading="lazy"
          decoding="async"
        />
      </div>

      <div class="latest-media latest-video-wrap relative bg-black">
        <video
          #promoVideo
          class="latest-media-fill latest-video"
          [src]="videoSrc"
          autoplay
          loop
          playsinline
          preload="auto"
          muted
          [muted]="true"
          defaultmuted
          disablepictureinpicture
          disableremoteplayback
          aria-hidden="true"
          tabindex="-1"
        ></video>
      </div>

      <div
        class="latest-panel flex flex-col items-center justify-center gap-3 bg-white px-3 text-center sm:gap-4 sm:px-4 lg:gap-5 lg:px-6"
      >
        <h2 id="latest-arrivals-heading" class="font-display latest-title text-[#1a2b48] uppercase">
          Latest<br />Arrivals
        </h2>

        <nav
          class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2"
          aria-label="Shop by category"
        >
          @for (cat of categories; track cat.id) {
            <a
              [routerLink]="cat.path"
              class="latest-pill inline-flex items-center justify-center rounded-full border border-[#cfcfcf] px-2.5 py-1 text-[10px] tracking-wide text-[#1a2b48] uppercase transition-colors hover:border-[#1a2b48] hover:bg-[#1a2b48] hover:text-white sm:px-3 sm:py-1.5 sm:text-[11px]"
            >
              {{ cat.label }}
            </a>
          }
        </nav>
      </div>
    </div>
  </div>

  <!-- Product carousel — same as AmarBay Latest Arrivals strip -->
  <div class="latest-products relative mt-6 sm:mt-8 md:mt-10">
    <button
      type="button"
      class="latest-nav absolute top-1/2 left-0 z-10 hidden -translate-y-1/2 text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:cursor-default disabled:opacity-30 lg:-left-3 lg:block"
      aria-label="Previous products"
      [disabled]="!canPrev()"
      (click)="prev()"
    >
      «
    </button>

    <button
      type="button"
      class="latest-nav absolute top-1/2 right-0 z-10 hidden -translate-y-1/2 text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:cursor-default disabled:opacity-30 lg:-right-3 lg:block"
      aria-label="Next products"
      [disabled]="!canNext()"
      (click)="next()"
    >
      »
    </button>

    <div
      class="product-card-grid grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4 lg:gap-6"
      aria-live="polite"
    >
      @for (product of visibleProducts(); track product.id) {
        <article class="product-card">
          <a [routerLink]="product.path" class="product-card__media">
            <div class="product-card__image aspect-square">
              <img
                [src]="product.image"
                [alt]="product.alt"
                loading="lazy"
                decoding="async"
              />
            </div>
          </a>

          <div class="product-card__body">
            <h3 class="product-card__title product-card__title--display">
              <a [routerLink]="product.path">{{ product.name }}</a>
            </h3>

            <app-product-card-actions
              class="product-card__actions"
              [slug]="slugFromPath(product.path)"
              [price]="product.price"
              [currency]="product.currency"
            />
          </div>
        </article>
      }
    </div>

    <div class="mt-6 flex items-center justify-center gap-6 lg:hidden">
      <button
        type="button"
        class="text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:opacity-30"
        aria-label="Previous products"
        [disabled]="!canPrev()"
        (click)="prev()"
      >
        «
      </button>
      <button
        type="button"
        class="text-2xl leading-none text-[#c0c0c0] transition-colors hover:text-[#666] disabled:opacity-30"
        aria-label="Next products"
        [disabled]="!canNext()"
        (click)="next()"
      >
        »
      </button>
    </div>
  </div>
</section>
