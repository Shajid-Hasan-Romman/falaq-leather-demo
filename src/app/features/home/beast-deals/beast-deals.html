<section class="best-deals-section w-full bg-white py-8 md:py-10 xl:py-20">

  <div class="best-deals-container mx-auto w-full max-w-[1400px] px-4 md:px-8 xl:px-0">

    <!-- ========================================================= -->
    <!-- HEADING -->
    <!-- ========================================================= -->

    <div class="flex items-center justify-center gap-2">

      <div class="flex gap-1">
        <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
        <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
        <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
      </div>

      <span
        class="text-[10px] font-semibold uppercase tracking-[2px] text-[#62A403] md:text-[11px]"
      >
        FRESH FROM OUR FARM
      </span>

      <div class="flex gap-1">
        <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
        <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
        <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
      </div>

    </div>


    <!-- ========================================================= -->
    <!-- TITLE -->
    <!-- ========================================================= -->

    <h1
      class="best-deals-title my-4 text-center text-[22px] font-bold text-[#172B42] md:text-[32px] xl:my-6 xl:text-[40px]"
    >
      Best Deals of the Week!
    </h1>


    <!-- ========================================================= -->
    <!-- MOBILE -->
    <!-- ========================================================= -->

    <div class="best-deals-mobile grid grid-cols-2 gap-3 md:hidden">

      <div
        *ngFor="let item of deals"
        [routerLink]="['/products/product-details']"
        class="relative flex min-h-[320px] cursor-pointer flex-col rounded-[14px] border border-[#ECECEC] bg-white p-3"
      >

        <!-- Discount -->
        <span
          class="absolute right-2 top-2 rounded-full bg-[#F15A29] px-2 py-0.5 text-[9px] font-semibold text-white"
        >
          -27%
        </span>

        <!-- Image -->
        <div class="flex h-[130px] items-center justify-center">
          <img
            [src]="item.image"
            [alt]="item.name"
            class="max-h-[130px] w-[130px] object-contain"
          />
        </div>

        <!-- Name -->
        <h3
          class="mt-3 min-h-[40px] line-clamp-2 text-[13px] font-medium leading-5 text-[#232323]"
        >
          {{ item.name }}
        </h3>

        <!-- Price -->
        <div class="mt-2 flex items-center gap-1.5">
          <span class="text-[15px] font-bold text-[#74B72E]">
            ৳{{ item.price }}
          </span>

          <span class="text-[11px] text-gray-400 line-through">
            ৳{{ item.oldPrice }}
          </span>
        </div>

        <!-- Cart -->
        <button
          type="button"
          (click)="addToCart(item); $event.stopPropagation()"
          class="mt-auto flex h-9 w-full items-center justify-center gap-1.5 rounded-md bg-[#74B72E] text-[12px] font-semibold text-white"
        >
          <i class="fa-solid fa-cart-plus text-[11px]"></i>
          Add to Cart
        </button>

      </div>

    </div>


    <!-- ========================================================= -->
    <!-- LAPTOP + DESKTOP -->
    <!-- ========================================================= -->

    <div class="best-deals-grid hidden md:grid">

      <div
        *ngFor="let item of deals"
        [routerLink]="['/products/product-details']"
        class="best-deal-card cursor-pointer"
      >

        <!-- ===================================================== -->
        <!-- IMAGE -->
        <!-- ===================================================== -->

        <div class="best-deal-image">

          <img
            [src]="item.image"
            [alt]="item.name"
            class="best-deal-img"
          />

        </div>


        <!-- ===================================================== -->
        <!-- CONTENT -->
        <!-- ===================================================== -->

        <div class="best-deal-content">

          <!-- Product Name -->
          <h3 class="best-deal-name">
            {{ item.name }}
          </h3>


          <!-- Price -->
          <div class="best-deal-price">

            <span class="best-deal-current-price">
              ${{ item.price }}
            </span>

            <span class="best-deal-old-price">
              ${{ item.oldPrice }}
            </span>

          </div>


          <!-- =================================================== -->
          <!-- DESCRIPTION -->
          <!-- Hide on laptop, show on large desktop -->
          <!-- =================================================== -->

          <p class="best-deal-description">
            {{ item.description }}
          </p>


          <!-- =================================================== -->
          <!-- BUTTON -->
          <!-- =================================================== -->

          <button
            type="button"
            (click)="addToCart(item); $event.stopPropagation()"
            class="best-deal-button"
          >
            <i class="fa-solid fa-cart-plus"></i>
            <span>Add to Cart</span>
          </button>

        </div>

      </div>

    </div>

  </div>

</section>
