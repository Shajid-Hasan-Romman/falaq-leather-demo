<section class="w-full py-20 bg-white">

    <div class="mx-auto max-w-[1400px]">

        <!-- Heading -->

        <div class="flex items-center justify-center gap-2">

            <div class="flex gap-1">
                <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
                <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
                <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
            </div>

            <span class="text-[11px] font-semibold uppercase tracking-[2px] text-[#62A403]">
                FRESH FROM OUR FARM
            </span>

            <div class="flex gap-1">
                <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
                <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
                <span class="h-1 w-1 rounded-full bg-[#62A403]"></span>
            </div>

        </div>

        <!-- Title -->
        <h1 class="text-center text-[40px] font-bold my-6">Best Deals of the Week!</h1>

        <!-- Cards -->

        <div class="grid grid-cols-2 gap-8">

            <div *ngFor="let item of deals"
                class="flex h-[300px] w-[630px] overflow-hidden rounded-[24px] border border-[#8BC53F] bg-white transition duration-300 hover:shadow-xl">

                <!-- Image -->

                <div class="flex w-[230px] items-center justify-center">

                    <img [src]="item.image" class="w-[190px] object-cover">

                </div>

                <!-- Content -->

                <div class="flex flex-1 flex-col justify-center pr-8">

                    <h3 class="text-[20px] font-bold leading-8 text-[#252525]">

                        {{item.title}}

                    </h3>

                    <div class="mt-4 flex items-center gap-3">

                        <span class="text-[18px] font-bold text-[#74B72E]">

                            ${{item.price}}

                        </span>

                        <span class="text-[18px] text-gray-400 line-through">

                            ${{item.oldPrice}}

                        </span>

                    </div>

                    <p class="mt-4 text-[14px] leading-7 text-[#7A7A7A]">

                        {{item.description}}

                    </p>

                    <button
                        class="mt-6 flex h-[50px] w-[180px] items-center justify-center gap-3 rounded-md bg-[#74B72E] text-white font-semibold duration-300 hover:bg-[#5E9B27]">

                        <i class="fa-solid fa-cart-plus"></i>

                        Add to Cart

                    </button>

                </div>

            </div>

        </div>

    </div>

</section>
