<section
  class="home-hero relative w-full overflow-hidden bg-[#f5f5f5]"
  aria-label="Shop our collection"
  aria-roledescription="carousel"
>
  <div class="hero-track relative w-full">
    @for (slide of slides; track slide.id; let i = $index) {
      <a
        [routerLink]="slide.path"
        class="hero-slide block w-full"
        [class.is-active]="activeIndex() === i"
        [attr.aria-hidden]="activeIndex() !== i"
        [attr.tabindex]="activeIndex() === i ? 0 : -1"
      >
        <img
          [src]="slide.src"
          [alt]="slide.alt"
          class="hero-image"
          [attr.fetchpriority]="i === 0 ? 'high' : null"
          [attr.loading]="i === 0 ? 'eager' : 'lazy'"
          decoding="async"
        />
      </a>
    }

    <div
      class="absolute bottom-3 left-1/2 z-10 flex -translate-x-1/2 items-center gap-2 sm:bottom-5"
      role="tablist"
      aria-label="Hero slides"
    >
      @for (slide of slides; track slide.id; let i = $index) {
        <button
          type="button"
          class="h-2.5 w-2.5 rounded-full transition-colors"
          [class.bg-brand]="activeIndex() === i"
          [class.bg-white/80]="activeIndex() !== i"
          [attr.aria-label]="'Go to slide ' + (i + 1)"
          [attr.aria-selected]="activeIndex() === i"
          role="tab"
          (click)="goTo(i)"
        ></button>
      }
    </div>
  </div>
</section>
