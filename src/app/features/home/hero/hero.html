<section class="relative overflow-hidden bg-[#FFFFFF] py-4 md:py-5">

  <!-- Top Right Leaves -->
  <img
    src="image 13.png"
    alt="Leaves"
    class="absolute right-0 top-0 z-10 hidden h-auto w-[180px] overflow-hidden lg:block xl:w-[280px] 2xl:w-[310px]"
  />

  <!-- Main Hero -->
  <section class="w-full bg-white py-4 md:py-8 lg:py-8">

    <div
      class="relative ml-0 flex h-[270px] w-[95%] max-w-[377px] flex-col items-center overflow-hidden rounded-r-[300px] bg-[#F4F6F8] px-4 md:h-[420px] md:w-[90%] md:max-w-none md:flex-row md:rounded-r-[140px] md:px-8 lg:h-[460px] lg:w-[92%] lg:rounded-r-[160px] lg:px-10 xl:w-[85%] xl:min-h-[420px] xl:rounded-r-[200px] xl:px-16 2xl:w-[80%] 2xl:min-h-[620px] 2xl:rounded-r-[320px] 2xl:px-24"

      <!-- ================================================= -->
      <!-- LEFT SIDE -->
      <!-- ================================================= -->

      <div class="relative z-20 w-full pt-3 lg:w-1/2 lg:pt-0">

        <!-- Badge -->
        <div
          class="relative flex h-[26px] w-[170px] items-center justify-center md:h-[36px] md:w-[240px] lg:h-[34px] lg:w-[230px] xl:h-[38px] xl:w-[250px] 2xl:h-[44px] 2xl:w-[290px]"
        >
          <img
            src="Bitmap.png"
            alt="Organic Badge"
            class="absolute inset-0 h-full w-full object-contain"
          />

          <span
            class="relative z-10 text-[9px] font-semibold uppercase tracking-[0.08em] text-white md:text-[12px] lg:text-[11px] xl:text-[12px] 2xl:text-[14px]"
          >
            100% ORGANIC FOODS
          </span>
        </div>


        <!-- Heading -->
        <h1
          class="mt-2 text-[17px] font-bold leading-[1.25] text-[#1F2937] md:mt-3 md:text-[32px] md:leading-[1.3] lg:mt-2.5 lg:text-[32px] xl:mt-3 xl:text-[34px] xl:leading-[1.25] 2xl:mt-5 2xl:text-[50px] 2xl:leading-[1.2]"
        >
          Organic Veggies Foods<br />

          You Cook
          <span class="text-[#62A403]">Healthy</span>
        </h1>


        <!-- Description -->
        <p
          class="mt-1.5 max-w-[200px] text-[10px] leading-[14px] text-[#687188] md:mt-4 md:max-w-none md:text-[15px] md:leading-7 lg:mt-4 lg:text-[14px] lg:leading-6 xl:mt-4 xl:max-w-[380px] xl:text-[14px] xl:leading-6 2xl:mt-8 2xl:max-w-[650px] 2xl:text-[18px] 2xl:leading-10"
        >
          Morbi eget congue lectus. Donec eleifend ultricies urna et
          euismod. Sed consectetur tellus eget odio aliquet, vel vestibulum
          tellus sollicitudin. Morbi maximus metus eu eros tincidunt
        </p>


        <!-- ================================================= -->
        <!-- BUY NOW BUTTON -->
        <!-- ================================================= -->

        <!-- Button -->
<button
  type="button"
  (click)="goToProducts()"
  class="hero-buy-button group relative mt-3 flex h-[32px] w-[110px] items-center overflow-hidden rounded-full border border-[#DFE3E8] bg-[#62A403] px-2.5 pl-[3px] shadow-[0_8px_16px_rgba(22,28,36,0.24)] transition-all duration-300 hover:bg-[#4F8702] md:mt-6 md:h-[48px] md:w-[150px] md:pl-[6px] md:pr-6 lg:h-[44px] lg:w-[145px] xl:h-[44px] xl:w-[145px] 2xl:h-[58px] 2xl:w-[175px]"
>
  <!-- Animated Lock -->
  <span
    class="hero-buy-icon flex h-[26px] w-[26px] shrink-0 items-center justify-center rounded-full bg-white md:h-[38px] md:w-[38px] lg:h-[36px] lg:w-[36px] 2xl:h-[46px] 2xl:w-[46px]"
  >
    <i
      class="fa-solid fa-lock text-[11px] text-[#62A403] md:text-[14px] lg:text-[13px] 2xl:text-[16px]"
    ></i>
  </span>

  <!-- Button Text -->
  <span
    class="hero-buy-text flex w-full items-center justify-center text-[11px] font-semibold text-white md:text-[14px] lg:text-[13px] xl:text-[13px] 2xl:text-[16px]"
  >
    Buy Now
  </span>
</button>

      </div>


      <!-- ================================================= -->
      <!-- RIGHT SIDE -->
      <!-- ================================================= -->

      <div
        class="absolute bottom-0 right-0 h-[179px] w-[178px] md:h-[280px] md:w-[260px] lg:relative lg:h-full lg:w-1/2"

        <img
          src="image 1.png"
          alt="Fresh organic vegetables"
          class="absolute bottom-0 right-0 z-10 h-[179px] w-[178px] object-contain md:h-[260px] md:w-auto lg:h-[380px] lg:w-[380px] lg:object-cover xl:h-[460px] xl:w-[460px] 2xl:h-[567px] 2xl:w-[564px]"
        />

      </div>
