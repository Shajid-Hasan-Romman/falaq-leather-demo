<div
  class="min-h-screen w-full bg-gray-50 py-8"
  *ngIf="cartItems$ | async as cart; else emptyState"
>
  <div class="mx-auto max-w-7xl px-4">
    <!-- Progress indicator -->
    <div class="mb-8 flex items-center justify-center gap-4 text-sm font-medium">
      <span class="text-green-600">Cart</span>
      <span class="text-gray-300">›</span>
      <span class="text-gray-400">Checkout</span>
      <span class="text-gray-300">›</span>
      <span class="text-gray-400">Confirmation</span>
    </div>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3 lg:gap-8">
      <!-- Cart Items -->
      <div class="lg:col-span-2">
        <app-cart-section [items]="cart"></app-cart-section>
      </div>

      <!-- Order Summary -->
      <div class="lg:col-span-1">
        <app-order-summary></app-order-summary>
      </div>
    </div>

    <!-- Popular Products -->
    <app-popular-products></app-popular-products>
  </div>
</div>

<!-- Empty state -->
<ng-template #emptyState>
  <div class="min-h-screen w-full bg-gray-50 py-8">
    <div class="mx-auto max-w-7xl px-4">
      <div class="py-16 text-center">
        <div class="mb-6 text-6xl">🛒</div>
        <h2 class="mb-2 text-2xl font-bold text-gray-800">Your cart is empty</h2>
        <p class="mb-6 text-gray-600">
          Looks like you haven't added any products yet.
        </p>
        <a
          routerLink="/"
          class="inline-block rounded-md bg-green-600 px-6 py-3 text-sm font-semibold text-white transition-colors hover:bg-green-700"
          >Continue Shopping</a
        >
      </div>

      <!-- Popular Products -->
      <app-popular-products></app-popular-products>
    </div>
  </div>
</ng-template>
