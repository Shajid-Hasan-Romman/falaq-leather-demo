<div class="flex items-center gap-4 py-4 border-b border-[#e4e7ee] rounded-lg ">
  <!-- Image -->
  <div class="flex-shrink-0">
    <img
      [src]="item.image"
      [alt]="item.name"
      class="w-20 h-20 object-cover rounded-lg border border-[#e4e7ee]"
    />
  </div>

  <!-- Details -->
  <div class="flex-1 min-w-0">
    <h3 class="font-semibold text-[#212B36] line-clamp-1">{{ item.name }}</h3>
    <p *ngIf="item.weight" class="text-sm text-[#919EAB]">{{ item.weight }}</p>
  </div>

  <!-- Unit Price -->
  <div class="hidden sm:block w-24 text-right">
    <span class="text-[#637381]">৳{{ item.price | number }}</span>
  </div>

  <!-- Quantity -->
  <div class="flex items-center gap-2">
    <button
      (click)="decrease()"
      type="button"
      class="w-8 h-8 rounded-full border border-[#e4e7ee] flex items-center justify-center hover:bg-[#f3f4f6] transition"
    >
      <i class="fa-solid fa-minus text-xs text-[#637381]"></i>
    </button>
    <span class="text-lg font-semibold text-[#212B36] min-w-[32px] text-center">{{ item.quantity }}</span>
    <button
      (click)="increase()"
      type="button"
      class="w-8 h-8 rounded-full border border-[#e4e7ee] flex items-center justify-center hover:bg-[#f3f4f6] transition"
    >
      <i class="fa-solid fa-plus text-xs text-[#637381]"></i>
    </button>
  </div>

  <!-- Item Total -->
  <div class="hidden sm:block w-28 text-right">
    <span class="font-bold text-[#212B36]">৳{{ itemTotal | number }}</span>
  </div>

  <!-- Remove -->
  <div class="flex-shrink-0">
    <button
      (click)="remove()"
      type="button"
      class="w-8 h-8 rounded-full hover:bg-red-50 transition flex items-center justify-center text-[#dc2626]"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
</div>
