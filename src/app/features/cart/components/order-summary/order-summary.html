<div class="rounded-2xl border border-[#e4e7ee] bg-white p-6">
  <h2 class="mb-5 text-xl font-bold text-[#212B36]">
    Order Summary
  </h2>

  <!-- Subtotal -->
  <div class="flex justify-between border-b border-[#e4e7ee] py-3">
    <span class="text-[#637381]">
      Subtotal
    </span>

    <span class="font-semibold text-[#212B36]">
      ৳{{ subtotal$ | async | number }}
    </span>
  </div>

  <!-- Shipping -->
  <div class="border-b border-[#e4e7ee] py-4">
    <span class="mb-3 block text-sm text-[#637381]">
      Shipping Method
    </span>

    <div class="relative">

      <!-- Backdrop -->
      <div
        *ngIf="isOpen"
        (click)="isOpen = false"
        class="fixed inset-0 z-10 cursor-default"
      ></div>

      <!-- Shipping Trigger -->
      <button
        type="button"
        (click)="toggleShipping()"
        class="relative z-20 flex w-full items-center justify-between gap-3 rounded-xl border-2 border-[#e4e7ee] bg-[#F4F6F8] px-3.5 py-3 transition-colors hover:border-[#62A403]/50 hover:bg-gray-50"
        [attr.aria-expanded]="isOpen"
        aria-haspopup="listbox"
      >
        <!-- Selected Shipping -->
        <span class="flex min-w-0 items-center gap-2.5">

          <span
            class="flex h-[18px] w-[18px] shrink-0 items-center justify-center rounded-full border-2 border-[#62A403] bg-white"
          >
            <span
              class="h-2 w-2 rounded-full bg-[#62A403]"
            ></span>
          </span>

          <span
            class="truncate text-sm font-semibold text-[#212B36]"
          >
            {{ (selectedShipping$ | async)?.label }}
          </span>

        </span>

        <!-- Shipping Fee + Chevron -->
        <span class="flex shrink-0 items-center gap-2">

          <span class="text-sm font-bold text-[#62A403]">
            ৳{{ (shipping$ | async) | number }}
          </span>

          <i
            class="fa-solid fa-chevron-down text-xs text-[#637381] transition-transform duration-200"
            [ngClass]="{
              'rotate-180': isOpen
            }"
          ></i>

        </span>
      </button>

      <!-- Shipping Options -->
      <div
        *ngIf="isOpen"
        role="listbox"
        aria-label="Shipping options"
        class="absolute left-0 right-0 top-full z-30 mt-2 overflow-hidden rounded-xl border border-[#e4e7ee] bg-white shadow-lg"
      >

        <button
          *ngFor="let option of shippingOptions$ | async"
          type="button"
          role="option"
          (click)="selectShipping(option.id)"
          [attr.aria-selected]="
            (selectedShipping$ | async)?.id === option.id
          "
          class="flex w-full items-center justify-between gap-3 border-b border-[#f0f2f5] px-3.5 py-3 text-left transition-colors last:border-b-0 hover:bg-green-50"
          [ngClass]="{
            'bg-green-50':
              (selectedShipping$ | async)?.id === option.id
          }"
        >

          <!-- Radio + Label -->
          <span class="flex min-w-0 items-center gap-2.5">

            <span
              class="flex h-[18px] w-[18px] shrink-0 items-center justify-center rounded-full border-2 transition-colors"
              [ngClass]="{
                'border-[#62A403]':
                  (selectedShipping$ | async)?.id === option.id,
                'border-[#B6B6B6]':
                  (selectedShipping$ | async)?.id !== option.id
              }"
            >
              <span
                *ngIf="
                  (selectedShipping$ | async)?.id === option.id
                "
                class="h-2 w-2 rounded-full bg-[#62A403]"
              ></span>
            </span>

            <span
              class="truncate text-sm font-medium text-[#212B36]"
            >
              {{ option.label }}
            </span>

          </span>

          <!-- Fee -->
          <span
            class="shrink-0 text-sm font-bold"
            [ngClass]="{
              'text-[#62A403]':
                (selectedShipping$ | async)?.id === option.id,
              'text-[#212B36]':
                (selectedShipping$ | async)?.id !== option.id
            }"
          >
            ৳{{ option.fee | number }}
          </span>

        </button>

      </div>
    </div>
  </div>

  <!-- Grand Total -->
  <div
    class="mb-6 flex justify-between border-b-2 border-[#62A403] py-4"
  >
    <span class="text-lg font-bold text-[#212B36]">
      Total
    </span>

    <span class="text-xl font-bold text-[#62A403]">
      ৳{{ grandTotal$ | async | number }}
    </span>
  </div>

  <!-- Proceed To Checkout -->
  <button
    type="button"
    (click)="proceedToCheckout()"
    [disabled]="(isEmpty$ | async)"
    class="flex h-12 w-full items-center justify-center gap-2 rounded-full bg-[#62A403] font-semibold text-white transition hover:bg-[#4F8702] disabled:cursor-not-allowed disabled:opacity-50"
  >
    <i class="fa-solid fa-credit-card"></i>

    <span>
      Proceed to Checkout
    </span>
  </button>
</div>
